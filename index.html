<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Item</title>
</head>
<body style="font-family:sans-serif;padding:16px;text-align:center">
  <h2 id="title">Scan Item</h2>
  <div id="reader" style="width:100%;max-width:360px;margin:0 auto"></div>
  <p id="status" style="color:#555;margin-top:10px">Point the camera at the QR code.</p>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // Your Apps Script web app exec URL
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBAvvxTgJuywg8EjhNQBDRnXLHM0EKFw5mpL-3PDdy6iwByqZfV98tTLgouENFE9Hr-g/exec";

    var params = new URLSearchParams(window.location.search);
    var qtyAction = params.get("qtyAction") === "remove" ? "remove" : "add";

    // Two modes:
    //  - scanFor=item (default): boxId is fixed (from the box page), the
    //    scan decodes which ITEM's QR was shown. Existing behavior.
    //  - scanFor=box: itemId and quantity are fixed (from the item page),
    //    the scan decodes which BOX's QR was shown instead.
    var scanFor = params.get("scanFor") === "box" ? "box" : "item";
    var boxId = params.get("boxId") || "";
    var fixedItemId = params.get("itemId") || "";
    var fixedQuantity = params.get("quantity") || "";

    if (scanFor === "box") {
      document.getElementById("title").innerText =
        "Scan Box → " + (qtyAction === "remove" ? "remove" : "add") +
        (fixedQuantity ? " " + fixedQuantity : "") + " x " + fixedItemId;
      document.getElementById("status").innerText = "Point the camera at the box's QR code.";
    } else if (boxId) {
      document.getElementById("title").innerText =
        "Scan Item → " + (qtyAction === "remove" ? "remove from" : "add to") + " Box " + boxId;
    }

    // Ask for the PIN once per device, then remember it. The script
    // itself validates the PIN before making any change. A link back
    // here with &resetpin=1 (e.g. from an "invalid PIN" error page)
    // clears the stored PIN so it gets asked again.
    if (params.get("resetpin") === "1") {
      localStorage.removeItem("laVictoriaPin");
    }
    var pin = localStorage.getItem("laVictoriaPin") || "";
    if (!pin) {
      pin = window.prompt("Enter your PIN:") || "";
      if (pin) localStorage.setItem("laVictoriaPin", pin);
    }

    var scanning = true;

    function onScanSuccess(decodedText) {
      if (!scanning) return;
      scanning = false;
      document.getElementById("status").innerText = "Scanned. Saving...";
      html5QrCode.stop().catch(function () {});

      var itemId, targetBoxId;
      if (scanFor === "box") {
        var boxMatch = decodedText.match(/[?&]boxid=([^&]+)/i);
        targetBoxId = boxMatch ? decodeURIComponent(boxMatch[1]) : decodedText;
        itemId = fixedItemId;
      } else {
        var idMatch = decodedText.match(/[?&]id=([^&]+)/);
        itemId = idMatch ? decodeURIComponent(idMatch[1]) : decodedText;
        targetBoxId = boxId;
      }

      var form = document.createElement("form");
      form.method = "POST";
      form.action = APPS_SCRIPT_URL;
      // target left as default (top-level navigation of this tab)

      function addField(name, value) {
        var input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        input.value = value;
        form.appendChild(input);
      }
      addField("mode", "storage");
      addField("itemId", itemId);
      addField("boxId", targetBoxId);
      addField("qtyAction", qtyAction);
      if (scanFor === "box" && fixedQuantity) addField("quantity", fixedQuantity);
      addField("source", "scanbox");
      addField("pin", pin);

      document.body.appendChild(form);
      form.submit();
    }

    function onScanFailure() {}

    var html5QrCode = new Html5Qrcode("reader");
    html5QrCode
      .start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess,
        onScanFailure
      )
      .catch(function (err) {
        document.getElementById("status").innerText =
          "Camera error: " + err + ". Make sure you allowed camera access for this site.";
      });
  </script>
</body>
</html>
